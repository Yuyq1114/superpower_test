pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # __DNS_RESOLVER__ is substituted at container start (see start-nginx.sh)
  # with whatever nameserver IP the runtime placed in /etc/resolv.conf, so
  # this template stays portable across Docker and Kubernetes without
  # hardcoding either platform's DNS address. Using a resolver + a
  # variable-based proxy_pass below also means nginx resolves api-gateway
  # lazily per-request instead of at startup, so the frontend still starts
  # and serves static pages even if the gateway's DNS name is not yet
  # available.
  resolver __DNS_RESOLVER__ valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    set $api_gateway http://api-gateway:8080;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /api-healthz {
      proxy_pass $api_gateway/healthz;
    }

    location = /api-readyz {
      proxy_pass $api_gateway/readyz;
    }

    location /api/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Variable-based proxy_pass does not auto-append the matched URI, so
      # $request_uri is forwarded explicitly to preserve the original path
      # and query string exactly as received.
      proxy_pass $api_gateway$request_uri;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
