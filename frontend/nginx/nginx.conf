pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # This template's DNS resolver address below is substituted at container
  # start (see start-nginx.sh) with whichever nameserver the runtime placed
  # in /etc/resolv.conf, validated and normalized first, so this file stays
  # portable across Docker and Kubernetes without hardcoding either
  # platform's DNS address. Using a resolver directive together with a
  # variable-based proxy_pass below also means nginx resolves api-gateway
  # lazily per request instead of at startup, so the frontend still starts
  # and serves static pages even if the gateway's DNS name is not yet
  # available. NOTE: the substitution below is a blind global text
  # replacement, so this comment intentionally never spells out the literal
  # placeholder token to avoid being mangled by it.
  resolver __DNS_RESOLVER__ valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Substituted at container start (see start-nginx.sh): "api-gateway:8080"
    # for Compose, or the namespace-qualified Kubernetes Service DNS name
    # when running in a cluster. nginx's `resolver` directive queries DNS
    # with the literal name it's given -- unlike glibc's getaddrinfo, it
    # never consults /etc/resolv.conf's search-domain list -- so a bare
    # "api-gateway" would never resolve against CoreDNS, which only answers
    # for the fully namespaced Service name.
    set $api_gateway http://__API_GATEWAY_UPSTREAM__;

    # Baseline security headers for every response this server produces.
    # `always` extends them to error/redirect responses too. IMPORTANT:
    # nginx's add_header is replace-not-merge across configuration levels --
    # a location that declares ANY add_header of its own inherits none of
    # these -- so every such location below repeats the three directives.
    # See nginx_contract_test.go, which enforces exactly that.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
      # default_type, not add_header: `return` already emits a Content-Type,
      # and adding one duplicates the header on the wire.
      default_type text/plain;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
      return 200 "ok\n";
    }

    location = /api-healthz {
      proxy_pass $api_gateway/healthz;
    }

    location = /api-readyz {
      proxy_pass $api_gateway/readyz;
    }

    location /api/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Variable-based proxy_pass does not auto-append the matched URI, so
      # $request_uri is forwarded explicitly to preserve the original path
      # and query string exactly as received.
      proxy_pass $api_gateway$request_uri;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "DENY" always;
    }
  }
}
