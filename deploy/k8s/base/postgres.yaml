apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: fitness-checkin}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: fitness}
            - {name: POSTGRES_USER, value: fitness_admin}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: POSTGRES_ADMIN_PASSWORD}}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: AUTH_DB_PASSWORD}}
            - name: PLAN_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: PLAN_DB_PASSWORD}}
            - name: CHECKIN_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: CHECKIN_DB_PASSWORD}}
            - name: PROFILE_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: PROFILE_DB_PASSWORD}}
            - name: STATISTICS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: STATISTICS_DB_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/001-init.sh, subPath: 001-init.sh, readOnly: true}
          startupProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: 10, timeoutSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0550}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
