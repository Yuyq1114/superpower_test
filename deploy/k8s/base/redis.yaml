apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fitness-checkin}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'exec redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: REDIS_PASSWORD}}
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts:
            - {name: config, mountPath: /etc/redis/redis.conf, subPath: redis.conf, readOnly: true}
            - {name: data, mountPath: /data}
          startupProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping']}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping']}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping']}, periodSeconds: 10, timeoutSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: config
          configMap: {name: redis-config}
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
