apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: fitness-checkin}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: auth-service
          image: fitness/auth-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 9090}]
          envFrom: [{configMapRef: {name: fitness-config}}]
          env:
            - {name: DB_USER, value: auth_service}
            - {name: DB_SCHEMA, value: auth_schema}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: AUTH_DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: JWT_SECRET}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: fitness-secrets, key: REDIS_PASSWORD}}

          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auth-service}
  ports: [{name: http, port: 8080, targetPort: http}, {name: grpc, port: 9090, targetPort: grpc}]
---
