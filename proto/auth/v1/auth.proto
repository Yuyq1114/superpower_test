syntax = "proto3";
package auth.v1;
option go_package = "github.com/example/fitness-checkin/services/auth-service/internal/gen/auth/v1;authv1";
message User { string id = 1; string email = 2; string created_at = 3; }
message TokenPair { string access_token = 1; string refresh_token = 2; int64 access_expires_in = 3; int64 refresh_expires_in = 4; }
message RegisterRequest { string email = 1; string password = 2; }
message LoginRequest { string email = 1; string password = 2; }
message RefreshRequest { string refresh_token = 1; }
message LogoutRequest { string refresh_token = 1; }
message GetUserRequest { string user_id = 1; }
message AuthResponse { User user = 1; TokenPair tokens = 2; }
message GetUserResponse { User user = 1; }
message Empty {}
service AuthService { rpc Register(RegisterRequest) returns (AuthResponse); rpc Login(LoginRequest) returns (AuthResponse); rpc Refresh(RefreshRequest) returns (AuthResponse); rpc Logout(LogoutRequest) returns (Empty); rpc GetUser(GetUserRequest) returns (GetUserResponse); }
